<!DOCTYPE html>
<html>
<head>
    <title>Funny Landing Page</title>
    <style>
        html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }
        #videoContainer { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999; }
        #goNowBtn { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); padding: 18px 36px; font-size: 28px; font-weight: bold; background: #ff0000; color: #fff; border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        #goNowBtn:active { transform: translateX(-50%) scale(0.95); }
    </style>
</head>
<body>
    <button id="goNowBtn">Go Now</button>
    <div id="videoContainer"></div>

    <script>
        document.getElementById('goNowBtn').addEventListener('click', function() {
            this.style.display = 'none';

            const video = document.createElement('video');
            // REPLACE THIS URL WITH YOUR ACTUAL FUNNY VIDEO
            video.src = 'https://sample-videos.com/video123/mp4/720/big_buck_bunny_720p_1mb.mp4';
            video.autoplay = true;
            video.loop = true;
            video.muted = false;
            video.playsInline = false;
            video.volume = 1.0; // Max volume for THIS media element
            video.style.width = '100%';
            video.style.height = '100%';
            video.style.objectFit = 'cover';
            video.style.background = '#000';

            // Handle mobile browser restrictions
            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(async error => {
                    console.log("Autoplay prevented:", error);
                    // Show unmute overlay as fallback
                    const overlay = document.createElement('div');
                    overlay.style.position = 'fixed';
                    overlay.style.top = 0;
                    overlay.style.left = 0;
                    overlay.style.width = '100%';
                    overlay.style.height = '100%';
                    overlay.style.background = 'rgba(0,0,0,0.9)';
                    overlay.style.color = '#fff';
                    overlay.style.display = 'flex';
                    overlay.style.flexDirection = 'column';
                    overlay.style.alignItems = 'center';
                    overlay.style.justifyContent = 'center';
                    overlay.style.fontSize = '24px';
                    overlay.style.textAlign = 'center';
                    overlay.style.padding = '20px';
                    overlay.innerHTML = `
                        <div>🔊 Tap to enable sound & fullscreen</div>
                        <button style="margin-top:20px; padding:12px 28px; font-size:22px; background:#ff0000; color:#fff; border:none; border-radius:30px; cursor:pointer;">
                            Unmute & Play
                        </button>
                    `;
                    document.body.appendChild(overlay);

                    overlay.querySelector('button').addEventListener('click', () => {
                        video.muted = false;
                        video.play().then(() => overlay.remove());
                        // Request fullscreen after unmuting
                        if (video.requestFullscreen) video.requestFullscreen();
                        else if (video.webkitRequestFullscreen) video.webkitRequestFullscreen();
                    });
                });
            }

            document.getElementById('videoContainer').appendChild(video);

            // Attempt fullscreen
            if (video.requestFullscreen) {
                video.requestFullscreen().catch(e => console.log("Fullscreen error:", e));
            } else if (video.webkitRequestFullscreen) {
                video.webkitRequestFullscreen().catch(e => console.log("Fullscreen error:", e));
            }
        });
    </script>
</body>
</html>
